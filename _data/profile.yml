bio:
  - >-
    I manage the Sensor Group at EarthScope Consortium. We test and evaluate the NSF-supported
    instruments that researchers take into the field: broadband and short-period seismometers,
    accelerometers, infrasound sensors, ground-penetrating radar, and distributed acoustic sensing
    (DAS) systems. I also advise EarthScope's engineers and the research community on geophysical
    instruments, and I co-led the Design and Power Systems groups of EarthScope's Common Sensor Platform project.
  - >-
    My group's research covers both ends of a seismic recording. On the instrument side, we study
    how seismometers and fiber-optic cables respond to ground motion, how to calibrate them, and how
    far we can trust data recorded outside an instrument's ideal frequency range. On the Earth side,
    we combine seismic and infrasound data with computer simulations to study landslides, floods, and
    earthquake swarms. We also model mantle convection to understand how the history of subduction
    shapes Earth's topography and the orientation of its spin axis.
  - >-
    I earned my Ph.D. in geophysics from the University of Houston in 2024 and my M.S. and B.S. from
    Purdue University, and I spent two stints as an R&amp;D student researcher at Sandia National
    Laboratories. I'm an editor for <em>Seismica</em> and serve on the AGU Distributed Sensing
    Technical Committee.
